# Compatibility filename for docker_open5gs entrypoint variants.
# Live path uses amf.yaml + amf_init.sh (placeholders). Keep this aligned.
logger:
  file:
    path: /var/log/open5gs/amf.log

amf:
  sbi:
    server:
      - address: 10.10.3.31
        port: 7777
      - address: 10.10.2.11
        port: 7777
    client:
      # Open5GS MEASURED: only ONE nrf client URI.
      nrf:
        - uri: http://10.10.2.10:7777
      scp:
        - uri: http://10.10.2.21:7777
  ngap:
    server:
      - address: 10.10.2.11
      - address: 10.10.4.11
  metrics:
    server:
      - address: 10.10.2.11
        port: 9090
  access_control:
    - plmn_id: {mcc: "999", mnc: "70"}
    - plmn_id: {mcc: "001", mnc: "01"}
  relative_capacity: 255
  guami:
    - plmn_id: {mcc: "999", mnc: "70"}
      amf_id: {region: 2, set: 1}
    - plmn_id: {mcc: "001", mnc: "01"}
      amf_id: {region: 2, set: 1}
  # HOME tai/plmn_support: B1 same-PLMN gNB (gnb-home-plmn-auth.yaml); not true VPLMN camp
  tai:
    - plmn_id: {mcc: "999", mnc: "70"}
      tac: 1
    - plmn_id: {mcc: "001", mnc: "01"}
      tac: 1
  plmn_support:
    - plmn_id: {mcc: "999", mnc: "70"}
      s_nssai:
        - sst: 1
    - plmn_id: {mcc: "001", mnc: "01"}
      s_nssai:
        - sst: 1
  security:
    integrity_order: [NIA2, NIA1, NIA0]
    ciphering_order: [NEA0, NEA1, NEA2]
  network_name:
    full: LabVisited
    short: LABVS
  amf_name: lab-visited-amf0
