# Adapted from 5g-ntn-emulation-lab monitoring/prometheus.yml — lab addresses
# PROVENANCE: 5g-ntn-emulation-lab - Cursor/monitoring/prometheus.yml
global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["10.10.7.10:9090"]
  - job_name: lab-streamlit-hint
    static_configs:
      - targets: ["10.10.7.12:8501"]
  - job_name: flow-exporter
    # Docker Compose service DNS — gauges are instant-query friendly (no rate()).
    scheme: http
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ["flow-exporter:8010"]
# Open5GS metrics endpoints UNVERIFIED scrapeability (V15) — add when confirmed
