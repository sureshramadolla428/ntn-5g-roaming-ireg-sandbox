# Osmocom STP — minimal lab template
# Pattern: Osmocom osmo-stp.cfg examples (CS7 / M3UA).
# UNVERIFIED against installed osmo-stp package version — validate on Ubuntu.
# Bind: 10.10.5.10 M3UA/SCTP 2905 per network-plan.yaml

!
! osmo-stp lab stub for ntn-roaming-lab
!
line vty
 bind 127.0.0.1
!
cs7 instance 0
 point-code 0.23.3
 asp asp-clnt-msc 2905 0 m3ua
  remote-ip 10.10.5.12
  local-ip 10.10.5.10
  role server
  sctp-role server
 as as-clnt-msc m3ua
  asp asp-clnt-msc
  routing-key 0 0.23.1
 asp asp-clnt-hlr 2906 0 m3ua
  remote-ip 10.10.5.11
  local-ip 10.10.5.10
  role server
  sctp-role server
 as as-clnt-hlr m3ua
  asp asp-clnt-hlr
  routing-key 1 0.23.2
!
# UNVERIFIED: point-code / ASP naming must match osmo-msc/osmo-hlr peers on Ubuntu.
