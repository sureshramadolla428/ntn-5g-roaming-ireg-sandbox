# Osmocom HLR — minimal lab template
# Pattern: Osmocom osmo-hlr.cfg examples.
# UNVERIFIED against installed osmo-hlr — validate on Ubuntu.
# Bind: 10.10.5.11 per network-plan.yaml
# E.212 IMSI home range aligns with lab 00101… (see e212-e214-lab-map.md)

!
! osmo-hlr lab stub for ntn-roaming-lab
!
line vty
 bind 127.0.0.1
!
hlr
 gsup
  bind ip 10.10.5.11
!
cs7 instance 0
 point-code 0.23.2
 asp asp-clnt-to-stp 2905 0 m3ua
  remote-ip 10.10.5.10
  local-ip 10.10.5.11
  role client
  sctp-role client
 as as-clnt-to-stp m3ua
  asp asp-clnt-to-stp
  routing-key 0 0.23.2
!
# UNVERIFIED: GSUP bind and M3UA client roles depend on Osmocom version.
