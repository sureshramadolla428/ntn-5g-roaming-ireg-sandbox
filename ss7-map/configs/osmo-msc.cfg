# Osmocom MSC — minimal lab template
# Pattern: Osmocom osmo-msc.cfg examples (MAP UpdateLocation path for Phase 4 docs).
# UNVERIFIED against installed osmo-msc — validate on Ubuntu.
# Bind: 10.10.5.12 per network-plan.yaml
# This is a config scaffold for MAP call-flow study — not a claimed live attach path.

!
! osmo-msc lab stub for ntn-roaming-lab
!
line vty
 bind 127.0.0.1
!
network
 network country code 1
 mobile network code 1
 short name LabMSC
 long name LabVisitedMSC
!
msc
 mgw remote-ip 127.0.0.1
 mgw local-ip 127.0.0.1
!
cs7 instance 0
 point-code 0.23.1
 asp asp-clnt-to-stp 2905 0 m3ua
  remote-ip 10.10.5.10
  local-ip 10.10.5.12
  role client
  sctp-role client
 as as-clnt-to-stp m3ua
  asp asp-clnt-to-stp
  routing-key 0 0.23.1
!
# UNVERIFIED: NCC/MNC here are lab placeholders; roaming MAP peers need Ubuntu bring-up.
