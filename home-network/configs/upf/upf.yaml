logger:
  file:
    path: /open5gs/install/var/log/open5gs/upf.log

global:
  max:
    ue: MAX_NUM_UE

upf:
  pfcp:
    server:
      - address: UPF_IP
    client:
      smf:
        - address: SMF_IP
  gtpu:
    server:
      - address: UPF_IP
        advertise: UPF_ADVERTISE_IP
  session:
    - subnet: UE_IPV4_INTERNET
      gateway: UE_IPV4_INTERNET_GW
      dnn: internet
      dev: UPF_INTERNET_APN_IF_NAME
  metrics:
    server:
      - address: UPF_IP
        port: 9091
