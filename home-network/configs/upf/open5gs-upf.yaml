# Compatibility filename for docker_open5gs entrypoint variants.
logger:
  file:
    path: /var/log/open5gs/upf.log

upf:
  pfcp:
    server:
      - address: 10.10.1.24
    client:
      smf:
        - address: 10.10.1.23
  gtpu:
    server:
      - address: 10.10.1.24
  subnet:
    - addr: 10.45.0.1/16
      dnn: internet
      dev: ogstun
  metrics:
    server:
      - address: 10.10.1.24
        port: 9090
