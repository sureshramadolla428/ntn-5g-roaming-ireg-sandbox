db_uri: mongodb://MONGO_IP/open5gs
logger:
  file:
    path: /open5gs/install/var/log/open5gs/pcf.log

sbi:
  server:
    no_tls: true
  client:
    no_tls: true

global:
  max:
    ue: MAX_NUM_UE

pcf:
  sbi:
    server:
      # IPX first — visited AMF needs PCF after UDM (Open5GS roaming uses V-PCF;
      # lab stand-in: home PCF registers to visited NRF like AUSF/UDM/UDR).
      - address: PCF_IPX
        port: 7777
      - address: PCF_IP
        port: 7777
    client:
      # Open5GS MEASURED: only ONE nrf client. Register to visited NRF via IPX.
      nrf:
        - uri: http://VISITED_NRF_IPX:7777
      scp:
        # Visited SCP on ipx-net (home SCP stays on home NRF; PCF registers to visited NRF)
        - uri: http://VISITED_SCP_IPX:7777
  metrics:
    server:
      - address: PCF_IP
        port: 9091
