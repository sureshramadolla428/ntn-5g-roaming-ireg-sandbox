logger:
  file:
    path: /open5gs/install/var/log/open5gs/smf.log

sbi:
  server:
    no_tls: true
  client:
    no_tls: true

global:
  max:
    ue: MAX_NUM_UE

smf:
  sbi:
    server:
      - address: SMF_IP
        port: 7777
    client:
      nrf:
        - uri: http://NRF_IP:7777
      scp:
        - uri: http://SCP_IP:7777
  gtpc:
    server:
      - address: SMF_IP
  gtpu:
    server:
      - address: SMF_IP
  pfcp:
    server:
      - address: SMF_IP
    client:
      upf:
        - address: UPF_IP
  session:
    - subnet: UE_IPV4_INTERNET
      gateway: UE_IPV4_INTERNET_GW
      dnn: internet
  dns:
    - SMF_DNS1
    - SMF_DNS2
  mtu: 1450
  metrics:
    server:
      - address: SMF_IP
        port: 9091
